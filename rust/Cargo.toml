[workspace]
resolver = "2"
members = [
    "dbgate-core",
    "dbgate-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/dbgate/dbgate"

[workspace.dependencies]
# ---- core types / error handling ----
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "7"

# ---- async ----
tokio = { version = "1", features = ["full"] }

# ---- database drivers (Rust-native replacements for Node clients) ----
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }
base64 = "0.22"
mysql_async = "0.37"
clickhouse = { version = "0.13", features = ["rustls-tls"] }
oracledb = "26.0.0-beta.2"
rsfbclient = { version = "0.28", default-features = false, features = ["pure_rust"] }
scylla = { version = "1.8.0", features = ["chrono-04", "num-bigint-04", "rustls-023"] }

# ---- logging ----
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# ---- utilities ----
uuid = { version = "1", features = ["v4"] }

# ---- credential vault (OS keychain / Secret Service / DPAPI) ----
keyring = "4.2.0"

# ---- tauri v2 ----
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-build = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
